<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menuju Lokasi Pernikahan</title>
    <style>
        /* Mengatur dasar halaman agar bersih dan terpusat */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Kontainer Utama untuk Layar Intro */
        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Transisi menghilang perlahan (fade out) */
            transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
        }

        /* FRAME GAMBAR RESPONSIF */
        .image-wrapper {
            position: relative;
            width: 85vw; /* Mengikuti 85% lebar layar bawaan perangkat */
            max-width: 450px; /* Batas maksimal lebar di Laptop */
            aspect-ratio: 3 / 4; /* Rasio standar foto potret */
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        /* Pengaturan Gambar Utama (Tetap Diam & Tidak Geser Kiri-Kanan) */
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 
           LAPISAN EFEK KAIN BERKIBAR (Waving Overlay)
           Membuat efek bayangan gelombang dan pencahayaan angin di atas foto
        */
        .image-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: -200%; /* Memperpanjang area gelombang untuk animasi berjalan */
            width: 400%;
            height: 100%;
            
            /* Membuat pola linear gradient sebagai ilusi lipatan kain (gelap terang) */
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(0, 0, 0, 0.15) 40%,
                rgba(255, 255, 255, 0.25) 60%,
                rgba(0, 0, 0, 0.12) 80%,
                rgba(255, 255, 255, 0) 100%
            );
            
            /* Ukuran gelombang diatur agar berulang halus seperti kain */
            background-size: 50% 100%;
            
            /* Jalankan animasi bayangan kain tertiup angin */
            animation: windBlow 4s linear infinite;
            mix-blend-mode: overlay; /* Menyatu secara natural dengan foto di bawahnya */
            pointer-events: none;
        }

        /* ANIMASI GERAKAN GELOMBANG ANGIN */
        @keyframes windBlow {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(50%); /* Menggeser bayangan secara horizontal menghasilkan efek kain melambai */
            }
        }

        /* Kelas CSS untuk memicu hilangnya intro secara perlahan */
        .intro-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Desain teks pemuatan di latar belakang */
        .loading-text {
            text-align: center;
            color: #333333;
            padding: 20px;
        }
    </style>
    <script>
        window.onload = function() {
            // --- ATUR TANGGAL PERNIKAHAN ANDA DI SINI (Format: TAHUN-BULAN-TANGGAL) ---
            const tanggalPernikahan = new Date("2026-12-13T23:59:59");
            
            const waktuSekarang = new Date();

            if (waktuSekarang > tanggalPernikahan) {
                // Tampilan jika sudah lewat H+1 (Logika pembatasan tetap utuh)
                document.body.innerHTML = `
                    <div style="text-align: center; margin-top: 50px; font-family: sans-serif; padding: 20px; width: 100%;">
                        <h2>Akses Lokasi Ditutup</h2>
                        <p>Mohon maaf, demi privasi keluarga besar, akses menuju peta lokasi pernikahan telah dinonaktifkan karena acara telah selesai.</p>
                        <p>Terima kasih atas pengertiannya.</p>
                    </div>
                `;
            } else {
                // Tampilkan gambar dengan efek kain selama 3 detik
                setTimeout(function() {
                    const intro = document.getElementById('intro');
                    if (intro) {
                        // Jalankan efek menghilang (fade out) selama 1.5 detik
                        intro.classList.add('intro-hidden');
                    }

                    // Pindah ke Google  tepat setelah efek menghilang selesai
                    setTimeout(function() {
                        // --- PASTE LINK GOOGLE MAPS RUMAH ANDA DI BAWAH INI ---
                        window.location.href = "https://www.google.com/maps/place/6%C2%B016'47.3%22S+107%C2%B003'17.1%22E/@-6.2799391,107.0543412,20.03z/data=!4m4!3m3!8m2!3d-6.279792!4d107.054743?entry=ttu&g_ep=EgoyMDI2MDgzMC4wIKXMDSoASAFQAw%3D%3D";
                    }, 1500);

                }, 3000); 
            }
        };
    </script>
</head>
<body>

    <!-- Layar Intro Gambar Pengantin dengan Efek Bayangan Kain Berkibar -->
    <div id="intro" class="intro-container">
        <div class="image-wrapper">
            <img src="pengantin.jpeg" alt="Foto Pengantin">
        </div>
    </div>

    <!-- Halaman utama yang berada di latar belakang -->
    <div class="loading-text">
        <h3>Memuat Peta Lokasi...</h3>
        <p>Anda akan segera dialihkan ke Google Maps.</p>
    </div>

</body>
</html>
